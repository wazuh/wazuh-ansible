---
# Cluster Settings
indexer_version: 4.14.13

single_node: false
indexer_node_name: node-1
indexer_cluster_name: wazuh
indexer_network_host: '0.0.0.0'

indexer_node_master: true
indexer_node_data: true
indexer_node_ingest: true
indexer_start_timeout: 90

indexer_cluster_nodes:
  - "{{ indexer_node_name }}"
indexer_discovery_nodes:
  - 127.0.0.1

local_certs_path: "{{ playbook_dir }}/indexer/certificates"

# Minimum master nodes in cluster, 2 for 3 nodes Wazuh indexer cluster
minimum_master_nodes: 2

# Configure hostnames for Wazuh indexer nodes
# Example es1.example.com, es2.example.com
domain_name: wazuh.com

indexer_sec_plugin_conf_path: /etc/wazuh-indexer/opensearch-security
indexer_sec_plugin_tools_path: /usr/share/wazuh-indexer/plugins/opensearch-security/tools
indexer_conf_path: /etc/wazuh-indexer
indexer_index_path: /var/lib/wazuh-indexer/

# Security password
indexer_custom_user: ""
indexer_custom_user_role: "admin"

# Set JVM memory limits
indexer_jvm_xms: null

indexer_http_port: 9200

indexer_admin_password: changeme
dashboard_password: changeme

# Deployment settings
generate_certs: true
perform_installation: true

indexer_nolog_sensible: true

# Load the security configuration files (internal_users.yml with indexer_admin_password and
# dashboard_password) into a cluster that already has one. It replaces the users, roles and passwords
# changed after the deployment. Without it, the files are loaded only while the cluster has no security
# index, and on an existing cluster only the admin and kibanaserver passwords are set when they differ.
indexer_security_init_force: false

# Checks of the Wazuh indexer API (cluster state recovered, security index, security configuration loaded,
# passwords set, cluster green) are retried every 5 seconds this many times.
indexer_api_retries: 24
