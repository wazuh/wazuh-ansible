
---

- name: Update cache
  apt:
    update_cache: yes

- name: Install Wazuh indexer dependencies
  apt:
    name:
      - unzip
      - wget
      - curl
      - apt-transport-https
      - gnupg
      - python3-debian
    state: present

- name: Add Wazuh indexer repository
  block:
    - name: Add apt repository signing key
      get_url:
        url: "{{ wazuh_repo.gpg }}"
        dest: "{{ wazuh_repo.path }}"

    - name: Import Wazuh repository GPG key
      command: "gpg --no-default-keyring --keyring gnupg-ring:{{ wazuh_repo.keyring_path }} --import {{ wazuh_repo.path }}"
      args:
        creates: "{{ wazuh_repo.keyring_path }}"

    - name: Set permissions for Wazuh repository GPG key
      file:
        path: "{{ wazuh_repo.keyring_path }}"
        mode: '0644'

    - name: Remove the apt source files of previous versions of the role
      file:
        path: "/etc/apt/sources.list.d/{{ item }}"
        state: absent
      loop:
        - wazuh-indexer.list
        - wazuh_repo.list
        - packages_wazuh_com_4_x_apt.list
        - packages_dev_wazuh_com_pre_release_apt.list
        - packages_dev_wazuh_com_staging_apt.list

    - name: Add Wazuh indexer repository
      deb822_repository:
        name: wazuh
        types: deb
        uris: "{{ wazuh_repo.apt_uri }}"
        suites: "{{ wazuh_repo.apt_suite }}"
        components: "{{ wazuh_repo.apt_component }}"
        signed_by: "{{ wazuh_repo.keyring_path }}"
        state: present

    - name: Update the apt cache
      apt:
        update_cache: true
      changed_when: false

- name: Install Wazuh indexer
  apt:
    name: wazuh-indexer={{ indexer_version }}-1
    state: present
  register: install
  tags: install