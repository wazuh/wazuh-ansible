- name: Configure IP (Private address)
  set_fact:
    target_address: "{{ hostvars[inventory_hostname]['private_ip'] if not single_node else indexer_network_host }}"
  when:
    - hostvars[inventory_hostname]['private_ip'] is defined

- name: Configure IP (Public address)
  set_fact:
    target_address: "{{ inventory_hostname if not single_node else indexer_network_host }}"
  when:
    - hostvars[inventory_hostname]['private_ip'] is not defined

- name: Ensure Indexer certificates directory permissions.
  file:
    path: "{{ indexer_conf_path }}/certs/"
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: 500

- name: Copy the node & admin certificates to Wazuh indexer cluster
  copy:
    src: "{{ local_certs_path }}/wazuh-certificates/{{ item }}"
    dest: "{{ indexer_conf_path }}/certs/"
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: 0400
  with_items:
    - root-ca.pem
    - "{{ indexer_node_name }}-key.pem"
    - "{{ indexer_node_name }}.pem"
    - admin-key.pem
    - admin.pem
  register: indexer_certs_copy
  when: generate_certs | bool

- name: Restart Wazuh indexer with security configuration
  systemd:
    name: wazuh-indexer
    state: restarted
  when: >-
    (indexer_package_redhat | default({})) is changed
    or (indexer_package_debian | default({})) is changed
    or (indexer_opensearch_conf | default({})) is changed
    or (indexer_certs_copy | default({})) is changed

- name: Ensure Wazuh indexer is started before the security initialization
  systemd:
    name: wazuh-indexer
    state: started

# The admin certificate is accepted by the REST API even before the security configuration is loaded, and
# it does not depend on passwords that may have been changed through the API. A cluster whose state is not
# recovered yet (for instance when every node restarts at the same time) is red, so waiting for yellow
# keeps the security index check below from reading an incomplete cluster state.
- name: Wait for the Wazuh indexer cluster to recover its state
  uri:
    url: "https://{{ target_address }}:{{ indexer_http_port }}/_cluster/health?wait_for_status=yellow&timeout=4s"
    client_cert: "{{ indexer_conf_path }}/certs/admin.pem"
    client_key: "{{ indexer_conf_path }}/certs/admin-key.pem"
    validate_certs: no
    timeout: 10
  register: indexer_cluster_health
  until: indexer_cluster_health.status == 200
  retries: "{{ indexer_api_retries }}"
  delay: 5

# securityadmin.sh replaces the users, roles and passwords of the whole cluster with the files of this
# node, so it runs only while the cluster has no security index. The node already joined the cluster, so
# a node added to an existing cluster (also with --limit) sees the index of the cluster.
- name: Check whether the cluster has the security configuration
  uri:
    url: "https://{{ target_address }}:{{ indexer_http_port }}/.opendistro_security"
    method: HEAD
    client_cert: "{{ indexer_conf_path }}/certs/admin.pem"
    client_key: "{{ indexer_conf_path }}/certs/admin-key.pem"
    validate_certs: no
    status_code: 200,404
    timeout: 4
  register: indexer_security_index
  until: indexer_security_index.status in [200, 404]
  retries: "{{ indexer_api_retries }}"
  delay: 5
  when: inventory_hostname == ansible_play_hosts[0]

- block:
  - name: Copy the Opensearch security internal users template
    template:
      src: "templates/internal_users.yml.j2"
      dest: "{{ indexer_sec_plugin_conf_path }}/internal_users.yml"
      mode: 0644

  - name: Hashing the custom admin password
    shell: |
      export JAVA_HOME=/usr/share/wazuh-indexer/jdk
      {{ indexer_sec_plugin_tools_path }}/hash.sh -p '{{ indexer_admin_password }}'
    register: indexer_admin_password_hashed
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Set the Admin user password
    replace:
      path: "{{ indexer_sec_plugin_conf_path }}/internal_users.yml"
      regexp: '(?<=admin:\n  hash: )(.*)(?=)'
      replace: "{{ indexer_password_hash | quote }}"
    vars:
      indexer_password_hash: "{{ indexer_admin_password_hashed.stdout_lines | last }}"

  # this can also be achieved with password_hash, but it requires dependencies on the controller
  - name: Hash the kibanaserver role/user pasword
    shell: |
      export JAVA_HOME=/usr/share/wazuh-indexer/jdk
      {{ indexer_sec_plugin_tools_path }}/hash.sh -p '{{ dashboard_password }}'
    register: indexer_kibanaserver_password_hashed
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Set the kibanaserver user password
    replace:
      path: "{{ indexer_sec_plugin_conf_path }}/internal_users.yml"
      regexp: '(?<=kibanaserver:\n  hash: )(.*)(?=)'
      replace: "{{ indexer_password_hash | quote }}"
    vars:
      indexer_password_hash: "{{ indexer_kibanaserver_password_hashed.stdout_lines | last }}"

  - name: Initialize the Opensearch security index in Wazuh indexer
    command: >
      sudo -u wazuh-indexer OPENSEARCH_PATH_CONF={{ indexer_conf_path }}
      JAVA_HOME=/usr/share/wazuh-indexer/jdk
      {{ indexer_sec_plugin_tools_path }}/securityadmin.sh
      -cd {{ indexer_sec_plugin_conf_path }}/
      -icl -p 9200 -cd {{ indexer_sec_plugin_conf_path }}/
      -nhnv
      -cacert {{ indexer_conf_path }}/certs/root-ca.pem
      -cert {{ indexer_conf_path }}/certs/admin.pem
      -key {{ indexer_conf_path }}/certs/admin-key.pem
      -h {{ target_address }}
    retries: 2
    delay: 5
    register: result
    until: result.rc == 0

  when:
    - inventory_hostname == ansible_play_hosts[0]
    - (indexer_security_init_force | bool) or indexer_security_index.status == 404

# indexer_admin_password and dashboard_password are the passwords the manager, Filebeat and the dashboard
# use, so the admin and kibanaserver users are given them again when they no longer match (a password
# rotated in the inventory, or changed through the API or wazuh-passwords-tool). The other users of the
# cluster are not touched. indexer_users_updated lists the users set here, so the manager and dashboard
# roles write their keystores again even if the inventory passwords did not change.
- block:
  - name: Wait for the Wazuh indexer node to load the security configuration
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/health"
      validate_certs: no
      timeout: 4
    register: indexer_security_health
    until: >-
      indexer_security_health.status == 200
      and (indexer_security_health.json | default({})).status | default('') == 'UP'
    retries: "{{ indexer_api_retries }}"
    delay: 5

  - name: Check the passwords of the admin and kibanaserver users
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/authinfo"
      user: "{{ item.user }}"
      password: "{{ item.password }}"
      force_basic_auth: yes
      validate_certs: no
      status_code: 200,401
      timeout: 4
    loop: "{{ indexer_api_users }}"
    loop_control:
      label: "{{ item.user }}"
    register: indexer_users_auth
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Check whether the users whose password no longer matches exist
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/api/internalusers/{{ item.user }}"
      client_cert: "{{ indexer_conf_path }}/certs/admin.pem"
      client_key: "{{ indexer_conf_path }}/certs/admin-key.pem"
      validate_certs: no
      status_code: 200,404
      timeout: 4
    loop: "{{ indexer_users_auth.results | selectattr('status', 'equalto', 401) | map(attribute='item') | list }}"
    loop_control:
      label: "{{ item.user }}"
    register: indexer_users_lookup
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Keep the users whose password is set again
    set_fact:
      indexer_users_to_set: "{{ indexer_users_lookup.results | selectattr('status', 'equalto', 200) | map(attribute='item') | list }}"
      indexer_users_missing: "{{ indexer_users_lookup.results | selectattr('status', 'equalto', 404) | map(attribute='item.user') | list }}"
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Report the users that do not exist in the cluster
    debug:
      msg: >-
        The users {{ indexer_users_missing | join(', ') }} do not exist in the Wazuh indexer cluster, so their
        password is not set. If they were removed or replaced on purpose, check the credentials the manager,
        Filebeat and the dashboard use.
    when: indexer_users_missing | length > 0

  - name: Hash the passwords that no longer match
    shell: |
      export JAVA_HOME=/usr/share/wazuh-indexer/jdk
      {{ indexer_sec_plugin_tools_path }}/hash.sh -p '{{ item.password }}'
    loop: "{{ indexer_users_to_set }}"
    loop_control:
      label: "{{ item.user }}"
    register: indexer_users_hashed
    changed_when: false
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Set the passwords that no longer match
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/api/internalusers/{{ item.item.user }}"
      method: PATCH
      client_cert: "{{ indexer_conf_path }}/certs/admin.pem"
      client_key: "{{ indexer_conf_path }}/certs/admin-key.pem"
      body_format: json
      body:
        - op: replace
          path: /hash
          value: "{{ item.stdout_lines | last }}"
      validate_certs: no
      timeout: 10
    loop: "{{ indexer_users_hashed.results }}"
    loop_control:
      label: "{{ item.item.user }}"
    changed_when: true
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Check the passwords that were set
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/authinfo"
      user: "{{ item.user }}"
      password: "{{ item.password }}"
      force_basic_auth: yes
      validate_certs: no
      timeout: 4
    loop: "{{ indexer_users_to_set }}"
    loop_control:
      label: "{{ item.user }}"
    register: indexer_users_recheck
    until: indexer_users_recheck.status == 200
    retries: "{{ indexer_api_retries }}"
    delay: 5
    no_log: '{{ indexer_nolog_sensible | bool }}'

  - name: Keep the users whose password was set
    set_fact:
      indexer_users_updated: "{{ indexer_users_to_set | map(attribute='user') | list }}"

  vars:
    indexer_api_users:
      - user: admin
        password: "{{ indexer_admin_password }}"
      - user: kibanaserver
        password: "{{ dashboard_password }}"
  when: inventory_hostname == ansible_play_hosts[0]

- block:
  - name: Check whether the custom user exists
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/api/internalusers/{{ indexer_custom_user }}"
      client_cert: "{{ indexer_conf_path }}/certs/admin.pem"
      client_key: "{{ indexer_conf_path }}/certs/admin-key.pem"
      validate_certs: no
      status_code: 200,404
      timeout: 4
    register: indexer_custom_user_check

  # Only created: a password or role changed after the deployment is kept.
  - name: Create custom user
    uri:
      url: "https://{{ target_address }}:{{ indexer_http_port }}/_plugins/_security/api/internalusers/{{ indexer_custom_user }}"
      method: PUT
      client_cert: "{{ indexer_conf_path }}/certs/admin.pem"
      client_key: "{{ indexer_conf_path }}/certs/admin-key.pem"
      body: |
        {
          "password": "{{ indexer_admin_password }}",
          "backend_roles": ["{{ indexer_custom_user_role }}"]
        }
      body_format: json
      validate_certs: no
      status_code: 200,201
      timeout: 4
    changed_when: true
    no_log: '{{ indexer_nolog_sensible | bool }}'
    when: indexer_custom_user_check.status == 404

  when:
    - indexer_custom_user | default('') | trim | length > 0
    - inventory_hostname == ansible_play_hosts[0]
