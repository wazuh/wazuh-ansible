---

- name: Importing variables [vars/main.yml]
  ansible.builtin.include_vars:
    file: ../../vars/main.yml

- name: Importing urls_file variables
  ansible.builtin.include_vars:
    file: ../../vars/{{ urls_file }}

- name: Linux | Check whether wazuh-dashboard is already installed
  ansible.builtin.include_role:
    name: package-urls
    tasks_from: check_installed.yml
  vars:
    wazuh_installed_package: wazuh-dashboard

# Kept apart: the next component's check overwrites wazuh_package_installed.
- name: Linux | Keep whether wazuh-dashboard is already installed
  ansible.builtin.set_fact:
    wazuh_dashboard_package_installed: "{{ wazuh_package_installed }}"

- name: Importing dependencies.yml
  ansible.builtin.import_tasks: dependencies.yml
  become: true

- name: Credentials | Generate or load the deployment passwords
  ansible.builtin.include_role:
    name: wazuh-credentials

# The names of the dashboard certificate. All-in-one, the package issues it from the CA it mints;
# distributed, it is issued on the control node from the CA of the deployment and staged in
# /etc/wazuh-dashboard/certs/ (the dashboard gets no ca/).
- name: Credentials | Certificate names of this dashboard node
  ansible.builtin.set_fact:
    wazuh_credentials_cert_sans:
      WAZUH_DASHBOARD_CERT_SANS: >-
        {{ (['DNS:' ~ dashboard_node_name, 'DNS:' ~ ansible_facts.hostname] | unique)
           + ['IP:' ~ hostvars[inventory_hostname].private_ip] }}

- name: Credentials | Provide the dashboard credentials before installing the package
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: deploy.yml
  vars:
    wazuh_credentials_component: dashboard
    wazuh_credentials_node_name: "{{ dashboard_node_name }}"

- name: Linux | Verify the wazuh-dashboard package signature
  ansible.builtin.include_role:
    name: package-urls
    tasks_from: verify_package_signature.yml
  vars:
    wazuh_package_file: >-
      {{ wazuh_dashboard_package_download_path }}/{{ wazuh_dashboard_package_name }}_{{ ansible_facts.architecture }}.{{ wazuh_package_type }}
    wazuh_package_type: "{{ 'rpm' if ansible_facts.os_family == 'RedHat' else 'deb' }}"
  when: not wazuh_dashboard_package_installed

- name: Linux CentOS/RedHat | Install wazuh-dashboard using yum
  ansible.builtin.dnf:
    name: "{{ wazuh_dashboard_package_download_path }}/{{ wazuh_dashboard_package_name }}_{{ ansible_facts.architecture }}.rpm"
    state: present
    # dnf also checks a local package, against any key rpm trusts: skipped only along with the Wazuh key check.
    disable_gpg_check: "{{ wazuh_skip_package_signature_check | default(false) | bool }}"
  become: true
  when:
    - ansible_facts.os_family == "RedHat"
    - not wazuh_dashboard_package_installed
  notify: Wazuh dashboard changed

- name: Linux Debian | Install wazuh-dashboard using APT
  ansible.builtin.apt:
    deb: "{{ wazuh_dashboard_package_download_path }}/{{ wazuh_dashboard_package_name }}_{{ ansible_facts.architecture }}.deb"
    state: present
  become: true
  when:
    - ansible_facts.os_family == 'Debian'
    - not wazuh_dashboard_package_installed
  notify: Wazuh dashboard changed

- name: Linux | Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Dashboard-config | Configure Wazuh dashboard
  notify: Wazuh dashboard changed
  block:
    # The scalar the package writes and the list of a previous run alike, up to the end of its last line:
    # a rerun finds the same text and changes nothing.
    - name: Dashboard-config | Set opensearch.hosts configuration
      ansible.builtin.replace:
        path: /etc/wazuh-dashboard/opensearch_dashboards.yml
        regexp: '(?m)^opensearch\.hosts:.*\n(?:[ \t]+-[ \t]+https?://.*\n)*'
        replace: |
          opensearch.hosts:
          {% for node in indexer_cluster_nodes %}
            - https://{{ node }}:9200
          {% endfor %}

    - name: Dashboard-config | Set Wazuh server host URL
      ansible.builtin.replace:
        path: /etc/wazuh-dashboard/opensearch_dashboards.yml
        regexp: '^(\s*)url:\s*https://.*$'
        replace: '\1url: https://{{ wazuh_manager_master_address }}'

- name: Credentials | Provide the indexer and manager CAs
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: peer_trust.yml
  vars:
    wazuh_credentials_component: dashboard

# The dashboard verifies each peer against that peer's CA only.
- name: Dashboard-config | Check that the dashboard verifies each peer against its own CA
  become: true
  block:
    - name: Dashboard-config | Read opensearch_dashboards.yml
      ansible.builtin.slurp:
        path: /etc/wazuh-dashboard/opensearch_dashboards.yml
      register: wazuh_dashboard_conf_raw

    - name: Dashboard-config | Assert the indexer and manager CAs
      ansible.builtin.assert:
        that:
          - conf_text is search('(?m)^opensearch\\.ssl\\.certificateAuthorities:.*certs/indexer-ca\\.pem')
          - conf_text is search('(?m)^\\s+ca:\\s*.*certs/manager-ca\\.pem')
        fail_msg: >-
          /etc/wazuh-dashboard/opensearch_dashboards.yml does not verify the indexer against
          certs/indexer-ca.pem and the Server API against certs/manager-ca.pem: this package does not use
          the per-component CAs of 5.0.0 RC 2.
        quiet: true
      vars:
        conf_text: "{{ wazuh_dashboard_conf_raw.content | b64decode }}"

- name: Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# The handler records whether the package or the configuration changed: only then is the dashboard restarted.
- name: Apply the pending changes of the dashboard
  ansible.builtin.meta: flush_handlers

- name: Ensure Wazuh dashboard started
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: start_service.yml
  vars:
    wazuh_service_name: wazuh-dashboard
    wazuh_service_restart: "{{ wazuh_dashboard_restart | default(false) }}"
    wazuh_service_watched_files:
      - /etc/wazuh-dashboard/opensearch_dashboards.yml

- name: Extract server host from dashboard configuration
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep '^server.host:' /etc/wazuh-dashboard/opensearch_dashboards.yml | awk '{print $2}'
    executable: /bin/bash
  register: server_host
  changed_when: false

- name: Extract server port from dashboard configuration
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep '^server.port:' /etc/wazuh-dashboard/opensearch_dashboards.yml | awk '{print $2}'
    executable: /bin/bash
  register: server_port
  changed_when: false

- name: Wait for Wazuh dashboard to be ready
  ansible.builtin.uri:
    url: "https://{{ server_host.stdout }}:{{ server_port.stdout }}/app/login"
    method: GET
    status_code: 200
    validate_certs: false
  register: result
  retries: 24
  delay: 5
  until: result.status == 200

- name: Remove installation leftovers
  ansible.builtin.file:
    path: "{{ wazuh_dashboard_package_download_path }}"
    state: absent
    force: true
  become: true
