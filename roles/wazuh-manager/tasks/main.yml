---

- name: Importing variables [vars/main.yml]
  ansible.builtin.include_vars:
    file: ../../vars/main.yml

- name: Importing urls_file variables
  ansible.builtin.include_vars:
    file: ../../vars/{{ urls_file }}

- name: Install Wazuh Manager
  block:
    - name: Check if local_configs_path directory exists
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: Retrieve local_configs_path directory information
          ansible.builtin.stat:
            path: "{{ local_configs_path }}"
          register: local_configs_path_stat

        - name: Fail if local_configs_path does not exist
          ansible.builtin.fail:
            msg: "The directory {{ local_configs_path }} (local_configs_path) does not exist."
          when: not local_configs_path_stat.stat.exists

    - name: Credentials | Generate or load the deployment passwords
      ansible.builtin.include_role:
        name: wazuh-credentials

    - name: Credentials | Fail if wazuh_manager_ips is set for a multi-node cluster
      ansible.builtin.fail:
        msg: >-
          wazuh_manager_ips applies only to single-node deployments. Set extra_ips on the
          corresponding entry of 'instances' instead for a per-node address, or use agent_san for an
          address shared by the whole cluster (e.g. a load balancer).
      when:
        - not single_node
        - wazuh_manager_ips | length > 0

    # The names of this node's agent listener (remoted.pem) and Server API (apid.pem) certificates (the
    # loopback names are always added). Each certificate names this node only, as the installation
    # assistant issues them: its name, host name and addresses. agent_san adds the address agents use
    # to reach the cluster (a DNS name or a load balancer, the same on every node), so the master mints
    # enrolment tokens for it and agents connect to any node through it; the master refuses a token
    # for an address its certificate does not name. api_san does the same for the Server API. Bare
    # values are classified: an IPv4 address, or anything with a colon, is an IP entry; anything else
    # a DNS entry.
    - name: Credentials | Certificate names of this manager node
      ansible.builtin.set_fact:
        # The names of the node alone, for its client pair for the indexer (indexer-connector.pem).
        wazuh_credentials_node_sans: >-
          {{ own_names
             | map('regex_replace', '^(?!(DNS|IP):)([0-9.]+|.*:.*)$', 'IP:\g<2>')
             | map('regex_replace', '^(?!(DNS|IP):)', 'DNS:') | unique | list }}
        wazuh_credentials_cert_sans:
          WAZUH_MANAGER_REMOTED_CERT_SANS: >-
            {{ (own_names + agent_san)
               | map('regex_replace', '^(?!(DNS|IP):)([0-9.]+|.*:.*)$', 'IP:\g<2>')
               | map('regex_replace', '^(?!(DNS|IP):)', 'DNS:') | unique | list }}
          WAZUH_MANAGER_APID_CERT_SANS: >-
            {{ (own_names + api_san)
               | map('regex_replace', '^(?!(DNS|IP):)([0-9.]+|.*:.*)$', 'IP:\g<2>')
               | map('regex_replace', '^(?!(DNS|IP):)', 'DNS:') | unique | list }}
      vars:
        # In a cluster, this node comes from instances (keyed by inventory host name); a single node, or
        # a play without instances, is just this host, with wazuh_manager_ips as its extra addresses.
        own_node: { name: "{{ manager_node_name }}", ip: "{{ private_ip }}", extra_ips: "{{ wazuh_manager_ips }}" }
        this_node: >-
          {{ (instances | default({}))[inventory_hostname]
             if (not single_node and inventory_hostname in (instances | default({}))) else own_node }}
        own_names: >-
          {{ [this_node.name, manager_node_name, ansible_facts.hostname, this_node.ip]
             + this_node.extra_ips | default([]) }}

    - name: Credentials | Provide the manager credentials before installing the package
      ansible.builtin.include_role:
        name: wazuh-credentials
        tasks_from: deploy.yml
      vars:
        wazuh_credentials_component: manager
        wazuh_credentials_node_name: "{{ manager_node_name }}"

    - name: Linux | Check whether wazuh-manager is already installed
      ansible.builtin.include_role:
        name: package-urls
        tasks_from: check_installed.yml
      vars:
        wazuh_installed_package: wazuh-manager

    # Kept apart: the next component's check overwrites wazuh_package_installed.
    - name: Linux | Keep whether wazuh-manager is already installed
      ansible.builtin.set_fact:
        wazuh_manager_package_installed: "{{ wazuh_package_installed }}"

    - name: Ensure wazuh-manager package download directory exists
      ansible.builtin.file:
        path: "{{ wazuh_manager_package_download_path }}"
        state: directory
        mode: '0755'
      when: not wazuh_manager_package_installed

    - name: RHEL-based | Download wazuh-manager package
      when:
        - ansible_facts.os_family == 'RedHat'
        - not wazuh_manager_package_installed
      block:
        - name: RedHat/CentOS/Fedora (x86_64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_x86_64_rpm }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"
            mode: '0644'
          when:
            - ansible_facts.architecture == "x86_64"

        - name: RedHat/CentOS/Fedora (aarch64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_aarch64_rpm }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"
            mode: '0644'
          when:
            - ansible_facts.architecture == "aarch64"

        - name: RedHat/CentOS/Fedora | Verify the wazuh-manager package signature
          ansible.builtin.include_role:
            name: package-urls
            tasks_from: verify_package_signature.yml
          vars:
            wazuh_package_file: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"

        - name: RedHat/CentOS/Fedora | Install wazuh-manager package
          ansible.builtin.dnf:
            name: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"
            state: present
            # dnf also checks a local package, against any key rpm trusts: skipped only along with the Wazuh key check.
            disable_gpg_check: "{{ wazuh_skip_package_signature_check | default(false) | bool }}"
          notify: Wazuh manager changed

    - name: Debian-based systems | Download wazuh-manager package
      when:
        - ansible_facts.os_family == 'Debian'
        - not wazuh_manager_package_installed
      block:
        - name: Debian-based (AMD64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_amd64_deb }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"
            mode: '0644'
          when:
            - ansible_facts.architecture == "x86_64"

        - name: Debian-based (ARM64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_arm64_deb }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"
            mode: '0644'
          when:
            - ansible_facts.architecture == "aarch64"

        - name: Debian-based | Verify the wazuh-manager package signature
          ansible.builtin.include_role:
            name: package-urls
            tasks_from: verify_package_signature.yml
          vars:
            wazuh_package_file: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"

        - name: Debian-based | Install wazuh-manager package
          ansible.builtin.apt:
            deb: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"
            state: present
          notify: Wazuh manager changed

    - name: Linux | Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    # The staged trust and pairs get the manager group, and the resolver runs again (distributed only).
    - name: Credentials | Hand the staged certificates to the manager
      ansible.builtin.include_role:
        name: wazuh-credentials
        tasks_from: peer_trust.yml
      vars:
        wazuh_credentials_component: manager

    - name: Manager-config | Check that the manager verifies the indexer against the indexer CA
      block:
        - name: Manager-config | Read wazuh-manager.conf
          ansible.builtin.slurp:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
          register: wazuh_manager_conf_raw

        - name: Manager-config | Assert the indexer CA in <indexer><ssl>
          ansible.builtin.assert:
            that: indexer_cas | select('search', '(^|/)certs/indexer-ca\\.pem$') | list | length > 0
            fail_msg: >-
              The <indexer><ssl> block of {{ wazuh_manager_conf_dir }}/wazuh-manager.conf does not name
              certs/indexer-ca.pem as its certificate authority ({{ indexer_cas | join(', ') or 'none' }}):
              this package does not use the per-component CAs of 5.0.0 RC 2.
            quiet: true
          vars:
            conf_text: "{{ wazuh_manager_conf_raw.content | b64decode | regex_replace('(?s)<!--.*?-->', '') }}"
            indexer_ssl_block: "{{ conf_text | regex_findall('(?s)<indexer[^>]*>.*?<ssl>(.*?)</ssl>.*?</indexer>') | first | default('') }}"
            indexer_cas: "{{ indexer_ssl_block | regex_findall('<ca>\\s*([^<]+?)\\s*</ca>') }}"

    - name: Manager-config | Configure cluster authentication key
      when: not single_node
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: Cluster-key | Generate shared cluster authentication key
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              openssl rand -hex 16 > "{{ local_configs_path }}/wazuh-cluster-key"
              chmod 600 "{{ local_configs_path }}/wazuh-cluster-key"
            executable: /bin/bash
          args:
            creates: "{{ local_configs_path }}/wazuh-cluster-key"

        - name: Cluster-key | Read shared cluster authentication key
          ansible.builtin.slurp:
            path: "{{ local_configs_path }}/wazuh-cluster-key"
          register: wazuh_cluster_key_raw

        - name: Cluster-key | Set cluster authentication key fact
          ansible.builtin.set_fact:
            wazuh_cluster_key: "{{ wazuh_cluster_key_raw.content | b64decode | trim }}"

    - name: Manager-config | Edit the wazuh-manager.conf file
      notify: Wazuh manager changed
      block:
        - name: Manager-config | Replace indexer hosts in wazuh-manager.conf
          ansible.builtin.replace:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
            # Up to the end of the line, and the blank lines earlier runs left after it, as the replacement
            # ends its last line: a rerun then finds the same text and changes nothing.
            regexp: '(?m)^[ \t]*<hosts>[\s\S]*?</hosts>[ \t]*\n(?:[ \t]*\n)*'
            replace: |2
                  <hosts>
              {% for node in wazuh_indexer_hosts %}
                    <host>https://{{ node.host }}:{{ node.port }}</host>
              {% endfor %}
                  </hosts>

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (node name)
          ansible.builtin.replace:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
            regexp: '(<node_name>)[^<]+(</node_name>)'
            replace: '\1{{ manager_node_name }}\2'

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (node type)
          ansible.builtin.replace:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
            regexp: '(<node_type>)[^<]+(</node_type>)'
            replace: '\1{% if node_type == "master" or single_node %}master{% else %}worker{% endif %}\2'

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (cluster key)
          ansible.builtin.replace:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
            regexp: '(<node_type>[^<]+</node_type>\s*)<key>[^<]*(</key>)'
            replace: '\g<1><key>{{ wazuh_cluster_key }}\g<2>'
          when: not single_node

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (bind address)
          ansible.builtin.replace:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
            regexp: '(<bind_addr>)[\s\S]*?(</bind_addr>)'
            replace: '<bind_addr>0.0.0.0</bind_addr>'

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (nodes list)
          ansible.builtin.replace:
            path: "{{ wazuh_manager_conf_dir }}/wazuh-manager.conf"
            regexp: '(<node>)[\s\S]*?(</node>)'
            replace: '<node>{{ hostvars["manager"].private_ip }}</node>'
          when: not single_node

    - name: Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    # The handler records whether the package or the configuration changed: only then is the manager restarted.
    - name: Apply the pending changes of the manager
      ansible.builtin.meta: flush_handlers

    - name: Ensure Wazuh Manager service is started
      ansible.builtin.include_role:
        name: wazuh-credentials
        tasks_from: start_service.yml
      vars:
        wazuh_service_name: wazuh-manager
        wazuh_service_restart: "{{ wazuh_manager_restart | default(false) }}"

    # A worker publishes nothing: the Server API passwords live on the master.
    - name: Credentials | Use the passwords the manager published
      ansible.builtin.include_role:
        name: wazuh-credentials
        tasks_from: published.yml
      vars:
        wazuh_credentials_component: manager

    - name: Wazuh Manager | Health check (master)
      when: node_type == "master" or single_node
      block:
        - name: Wazuh Manager | Authenticate and obtain API token (master)
          ansible.builtin.uri:
            url: "https://{{ private_ip }}:55000/security/user/authenticate"
            method: POST
            user: "wazuh"
            password: "{{ wazuh_credentials.WAZUH_MANAGER_API_PASSWORD }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
          register: wazuh_api_auth
          until: wazuh_api_auth.status == 200
          retries: 12
          delay: 5
          no_log: true

        - name: Wazuh Manager | Perform API healthcheck (master)
          ansible.builtin.uri:
            url: "https://{{ private_ip }}:55000/cluster/healthcheck"
            method: GET
            headers:
              Authorization: "Bearer {{ wazuh_api_auth.json.data.token }}"
            validate_certs: false
            return_content: true
          register: wazuh_api_healthcheck
          until:
            - wazuh_api_healthcheck.status == 200
            - manager_node_name in wazuh_api_healthcheck.content
          retries: 12
          delay: 5
          no_log: true # carries the API token in its Authorization header

      # no_log hides why the health check gave up; report only the last HTTP status.
      rescue:
        - name: Wazuh Manager | Report the last HTTP status (master)
          ansible.builtin.fail:
            msg: >-
              The Server API health check failed. Last HTTP status:
              {{ wazuh_api_healthcheck.status | default(wazuh_api_auth.status | default('none')) }}.
              {{ ('The wazuh password was rejected: check that WAZUH_MANAGER_API_PASSWORD was in '
                  ~ wazuh_manager_conf_dir ~ '/local.env before the package was installed.'
                  ~ ('' if (single_node | default(false) | bool) else ' After a password change, copy the new'
                     ~ ' value to deployment-credentials/WAZUH_MANAGER_API_PASSWORD on the control node.'))
              if (wazuh_api_auth.status | default(0)) == 401
              else 'Check the service with journalctl -u wazuh-manager.' }}

    - name: Wazuh Manager | Health check (worker)
      when: node_type == "worker" and not single_node
      block:
        - name: Wazuh Manager | Perform CLI healthcheck (worker)
          ansible.builtin.command: /var/wazuh-manager/bin/cluster_control -l
          register: cluster_control_list
          changed_when: false
          until:
            - cluster_control_list.rc == 0
            - "'ERR' not in cluster_control_list.stdout"
          retries: 12
          delay: 5

    - name: Remove leftover installation files
      ansible.builtin.file:
        path: "{{ wazuh_manager_package_download_path }}"
        state: absent
        force: true
