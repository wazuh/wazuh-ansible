---

- name: Importing variables [vars/main.yml]
  ansible.builtin.include_vars:
    file: ../../vars/main.yml

- name: Importing urls_file variables
  ansible.builtin.include_vars:
    file: ../../vars/{{ urls_file }}

- name: Install Wazuh Manager
  block:
    - name: Check if local_configs_path directory exists
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: Retrieve local_configs_path directory information
          ansible.builtin.stat:
            path: "{{ local_configs_path }}"
          register: local_configs_path_stat

        - name: Fail if local_configs_path does not exist
          ansible.builtin.fail:
            msg: "The directory {{ local_configs_path }} (local_configs_path) does not exist."
          when: not local_configs_path_stat.stat.exists

    - name: Credentials | Generate or load the deployment passwords
      ansible.builtin.include_role:
        name: wazuh-credentials

    - name: Credentials | Provide the manager credentials before installing the package
      ansible.builtin.include_role:
        name: wazuh-credentials
        tasks_from: deploy.yml
      vars:
        wazuh_credentials_component: manager

    # The anchor, never its key, and the node's pairs are staged before the package is installed, as
    # wazuh-install.sh does it: the package then finds them (case C), uses them and issues nothing.
    - name: Credentials | Ensure the CA directory exists
      ansible.builtin.file:
        path: /etc/wazuh/ca
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Credentials | Provide the CA anchor, never its key
      ansible.builtin.copy:
        src: "{{ local_configs_path }}/wazuh-certificates/root-ca.pem"
        dest: /etc/wazuh/ca/root-ca.pem
        owner: root
        group: root
        mode: "0644"

    - name: Credentials | Check whether the manager package is already installed
      ansible.builtin.stat:
        path: "{{ wazuh_manager_install_path }}etc/wazuh-manager.conf"
      register: wazuh_manager_installed_conf

    # The wazuh-manager user does not exist yet, so the pairs are staged root-owned; the package's
    # postinst hands remoted* to wazuh-manager and indexer-connector* to root:wazuh-manager before it
    # resolves certificates. Skipped once the package is installed: staging again would reset those
    # owners, and the copies after the installation keep the pairs up to date.
    - name: Credentials | Stage the manager certificate pairs before installing the package
      when: not wazuh_manager_installed_conf.stat.exists
      block:
        # Each level is created with an explicit mode, as wazuh-install.sh does with umask 022: dpkg
        # keeps the mode of a directory that already exists, and the host's umask may be restrictive.
        - name: Credentials | Ensure the manager certificates directory exists
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - "{{ wazuh_manager_install_path }}"
            - "{{ wazuh_manager_install_path }}etc"
            - "{{ wazuh_manager_install_path }}etc/certs"

        - name: Credentials | Stage the indexer connector and agent listener pairs
          ansible.builtin.copy:
            src: "{{ local_configs_path }}/wazuh-certificates/{{ item.src }}"
            dest: "{{ wazuh_manager_install_path }}etc/certs/{{ item.dest }}"
            owner: root
            group: root
            mode: "0640"
          loop:
            - { src: "{{ manager_node_name }}.pem", dest: indexer-connector.pem }
            - { src: "{{ manager_node_name }}-key.pem", dest: indexer-connector-key.pem }
            - { src: "{{ manager_node_name }}-remoted.pem", dest: remoted.pem }
            - { src: "{{ manager_node_name }}-remoted-key.pem", dest: remoted-key.pem }

    - name: Ensure wazuh-manager package download directory exists
      ansible.builtin.file:
        path: "{{ wazuh_manager_package_download_path }}"
        state: directory
        mode: '0755'

    - name: RHEL-based | Download wazuh-manager package
      when: ansible_facts.os_family == 'RedHat'
      block:
        - name: RedHat/CentOS/Fedora (x86_64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_x86_64_rpm }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"
            mode: '0644'
          when:
            - ansible_facts.architecture == "x86_64"

        - name: RedHat/CentOS/Fedora (aarch64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_aarch64_rpm }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"
            mode: '0644'
          when:
            - ansible_facts.architecture == "aarch64"

        - name: RedHat/CentOS/Fedora | Install wazuh-manager package
          ansible.builtin.dnf:
            name: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.rpm"
            state: present
            disable_gpg_check: true

    - name: Debian-based systems | Download wazuh-manager package
      when: ansible_facts.os_family == 'Debian'
      block:
        - name: Debian-based (AMD64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_amd64_deb }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"
            mode: '0644'
          when:
            - ansible_facts.architecture == "x86_64"

        - name: Debian-based (ARM64) | Download wazuh-manager package
          ansible.builtin.get_url:
            url: "{{ wazuh_manager_arm64_deb }}"
            dest: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"
            mode: '0644'
          when:
            - ansible_facts.architecture == "aarch64"

        - name: Debian-based | Install wazuh-manager package
          ansible.builtin.apt:
            deb: "{{ wazuh_manager_package_download_path }}/{{ wazuh_manager_package_name }}_{{ ansible_facts.architecture }}.deb"
            state: present

    - name: Linux | Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Detect the manager's indexer client certificate/key paths from wazuh-manager.conf
      block:
        - name: Read wazuh-manager.conf
          ansible.builtin.slurp:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
          register: wazuh_manager_conf_raw
          changed_when: false

        - name: Extract the indexer SSL certificate/key paths
          ansible.builtin.set_fact:
            expected_cert_path: "{{ (indexer_certificates | first | default('') | trim) }}"
            expected_key_path: "{{ (indexer_keys | first | default('') | trim) }}"
          vars:
            conf_text: "{{ wazuh_manager_conf_raw.content | b64decode | regex_replace('(?s)<!--.*?-->', '') }}"
            indexer_ssl_block: "{{ conf_text | regex_findall('(?s)<indexer[^>]*>.*?<ssl>(.*?)</ssl>.*?</indexer>') | first | default('') }}"
            indexer_certificates: "{{ indexer_ssl_block | regex_findall('(?s)<certificate>\\s*([^<]+\\.pem)\\s*</certificate>') }}"
            indexer_keys: "{{ indexer_ssl_block | regex_findall('(?s)<key>\\s*([^<]+\\.pem)\\s*</key>') }}"

        - name: Validate expected certificate and key filenames
          ansible.builtin.assert:
            that:
              - ( expected_cert_path | length > 0 ) and ( expected_key_path | length > 0 )
              - ( expected_cert_path is match('^/?.+\\.pem$') )
              - ( expected_key_path is match('^/?.+\\.pem$') )
            fail_msg: >-
              Could not find the indexer SSL certificate/key paths inside the <indexer><ssl>
              block of /var/wazuh-manager/etc/wazuh-manager.conf.
          changed_when: false

        - name: Set cert and key full paths
          ansible.builtin.set_fact:
            full_cert_path: "{{ wazuh_manager_install_path }}{{ expected_cert_path }}"
            full_key_path: "{{ wazuh_manager_install_path }}{{ expected_key_path }}"

        - name: Create expected cert/key directory (if does not exist)
          ansible.builtin.file:
            path: "{{ full_cert_path | dirname }}"
            state: directory
            owner: root
            group: wazuh-manager
            mode: "1770"

    - name: Copy root-ca certificate from local to the Wazuh Manager instance
      ansible.builtin.copy:
        src: "{{ local_configs_path }}/wazuh-certificates/root-ca.pem"
        dest: "{{ full_cert_path | dirname }}/root-ca.pem"
        owner: root
        group: wazuh-manager
        mode: '0640'

    - name: Copy the manager's indexer certificate/key to the Wazuh Manager instance
      ansible.builtin.copy:
        src: "{{ local_configs_path }}/wazuh-certificates/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: wazuh-manager
        mode: '0640'
      with_items:
        - { src: "{{ manager_node_name }}.pem", dest: "{{ full_cert_path }}" }
        - { src: "{{ manager_node_name }}-key.pem", dest: "{{ full_key_path }}" }
      when: item.src != item.dest

    - name: Copy the agent listener certificate to the Wazuh Manager instance
      ansible.builtin.copy:
        src: "{{ local_configs_path }}/wazuh-certificates/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: wazuh-manager
        group: wazuh-manager
        mode: '0640'
      with_items:
        - { src: "{{ manager_node_name }}-remoted.pem", dest: "{{ wazuh_manager_install_path }}etc/certs/remoted.pem" }
        - { src: "{{ manager_node_name }}-remoted-key.pem", dest: "{{ wazuh_manager_install_path }}etc/certs/remoted-key.pem" }

    - name: Manager-config | Configure cluster authentication key
      when: not single_node
      run_once: true
      delegate_to: localhost
      become: false
      block:
        - name: Cluster-key | Generate shared cluster authentication key
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              openssl rand -hex 16 > "{{ local_configs_path }}/wazuh-cluster-key"
              chmod 600 "{{ local_configs_path }}/wazuh-cluster-key"
            executable: /bin/bash
          args:
            creates: "{{ local_configs_path }}/wazuh-cluster-key"

        - name: Cluster-key | Read shared cluster authentication key
          ansible.builtin.slurp:
            path: "{{ local_configs_path }}/wazuh-cluster-key"
          register: wazuh_cluster_key_raw

        - name: Cluster-key | Set cluster authentication key fact
          ansible.builtin.set_fact:
            wazuh_cluster_key: "{{ wazuh_cluster_key_raw.content | b64decode | trim }}"

    - name: Manager-config | Edit the wazuh-manager.conf file
      block:
        - name: Manager-config | Replace indexer hosts in wazuh-manager.conf
          ansible.builtin.replace:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
            regexp: '(^[ \t]*)<hosts>[\s\S]*?</hosts>'
            replace: |1
                  <hosts>
              {% for node in wazuh_indexer_hosts %}
                    <host>https://{{ node.host }}:{{ node.port }}</host>
              {% endfor %}
                  </hosts>

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (node name)
          ansible.builtin.replace:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
            regexp: '(<node_name>)[^<]+(</node_name>)'
            replace: '\1{{ manager_node_name }}\2'

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (node type)
          ansible.builtin.replace:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
            regexp: '(<node_type>)[^<]+(</node_type>)'
            replace: '\1{% if node_type == "master" or single_node %}master{% else %}worker{% endif %}\2'

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (cluster key)
          ansible.builtin.replace:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
            regexp: '(<node_type>[^<]+</node_type>\s*)<key>[^<]*(</key>)'
            replace: '\g<1><key>{{ wazuh_cluster_key }}\g<2>'
          when: not single_node

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (bind address)
          ansible.builtin.replace:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
            regexp: '(<bind_addr>)[\s\S]*?(</bind_addr>)'
            replace: '<bind_addr>0.0.0.0</bind_addr>'

        - name: Manager-config | Edit cluster configuration in wazuh-manager.conf (nodes list)
          ansible.builtin.replace:
            path: /var/wazuh-manager/etc/wazuh-manager.conf
            regexp: '(<node>)[\s\S]*?(</node>)'
            replace: '<node>{{ hostvars["manager"].private_ip }}</node>'
          when: not single_node

    - name: Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: Ensure Wazuh Manager service is started
      ansible.builtin.service:
        name: "wazuh-manager"
        enabled: true
        state: restarted

    - name: Wazuh Manager | Health check (master)
      when: node_type == "master" or single_node
      block:
        - name: Wazuh Manager | Authenticate and obtain API token (master)
          ansible.builtin.uri:
            url: "https://{{ private_ip }}:55000/security/user/authenticate"
            method: POST
            user: "wazuh"
            password: "{{ wazuh_credentials.WAZUH_MANAGER_API_PASSWORD }}"
            force_basic_auth: true
            validate_certs: false
            return_content: true
          register: wazuh_api_auth
          until: wazuh_api_auth.status == 200
          retries: 12
          delay: 5
          no_log: true

        - name: Wazuh Manager | Perform API healthcheck (master)
          ansible.builtin.uri:
            url: "https://{{ private_ip }}:55000/cluster/healthcheck"
            method: GET
            headers:
              Authorization: "Bearer {{ wazuh_api_auth.json.data.token }}"
            validate_certs: false
            return_content: true
          register: wazuh_api_healthcheck
          until:
            - wazuh_api_healthcheck.status == 200
            - manager_node_name in wazuh_api_healthcheck.content
          retries: 12
          delay: 5
          no_log: true # carries the API token in its Authorization header

      # no_log hides why the health check gave up; report only the last HTTP status.
      rescue:
        - name: Wazuh Manager | Report the last HTTP status (master)
          ansible.builtin.fail:
            msg: >-
              The Server API health check failed. Last HTTP status:
              {{ wazuh_api_healthcheck.status | default(wazuh_api_auth.status | default('none')) }}.
              {{ 'The wazuh password was rejected: check that WAZUH_MANAGER_API_PASSWORD was in
              /etc/wazuh/credentials.env before the package was installed.'
              if (wazuh_api_auth.status | default(0)) == 401
              else 'Check the service with journalctl -u wazuh-manager.' }}

    - name: Wazuh Manager | Health check (worker)
      when: node_type == "worker" and not single_node
      block:
        - name: Wazuh Manager | Perform CLI healthcheck (worker)
          ansible.builtin.command: /var/wazuh-manager/bin/cluster_control -l
          register: cluster_control_list
          changed_when: false
          until:
            - cluster_control_list.rc == 0
            - "'ERR' not in cluster_control_list.stdout"
          retries: 12
          delay: 5

    - name: Remove leftover installation files
      ansible.builtin.file:
        path: "{{ wazuh_manager_package_download_path }}"
        state: absent
        force: true
