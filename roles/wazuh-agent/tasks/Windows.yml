---

- name: Windows | Ensure Wazuh agent download directory exists
  ansible.windows.win_file:
    path: "{{ wazuh_agent_win_package_download_path }}"
    state: directory

- name: Windows | Download Wazuh agent installer
  ansible.windows.win_get_url:
    url: "{{ wazuh_agent_windows }}"
    dest: "{{ wazuh_agent_win_package_download_path }}\\{{ wazuh_agent_package_name }}.msi"

# Since wazuh/wazuh#39063, a 5.x agent enrolls with a single enrollment token:
# the manager address and the CA pin travel inside the token itself, fetched
# over /cacerts and verified against the token's pin on the agent's first
# start (InstallerScripts.vbs, WAZUH_ENROLLMENT_TOKEN MSI property). No CA file
# is pre-staged, and none of WAZUH_MANAGER, WAZUH_REGISTRATION_PASSWORD,
# WAZUH_MANAGER_ENDPOINT, WAZUH_REGISTRATION_CA or SSL_VERIFICATION apply
# anymore (all warn-and-ignore on install); SSL_VERIFICATION is renamed
# WAZUH_SSL_VERIFICATION. Each optional property emits its own leading space
# inside the {%- if -%}, so an unset variable adds nothing at all rather than
# leaving a stray separator behind.
- name: Windows | Build install-time arguments for the Wazuh agent
  ansible.builtin.set_fact:
    wazuh_agent_install_args: >-
      /q WAZUH_ENROLLMENT_TOKEN="{{ wazuh_enrollment_token }}"
      {%- if wazuh_ssl_verification | default('') | length > 0 %} WAZUH_SSL_VERIFICATION="{{ wazuh_ssl_verification }}"{% endif %}

- name: Windows | Install Wazuh agent
  ansible.windows.win_package:
    path: "{{ wazuh_agent_win_package_download_path }}\\{{ wazuh_agent_package_name }}.msi"
    arguments: "{{ wazuh_agent_install_args }}"
    state: present

- name: Windows | Stop Wazuh agent service (if already running)
  ansible.windows.win_service:
    name: "Wazuh"
    state: stopped

- name: Windows | Start Wazuh agent service
  ansible.windows.win_service:
    name: "Wazuh"
    state: started

# win_service's own `state: started` above does not detect this failure mode:
# Start-Service is called without -Wait and win_service echoes the requested state
# back as `running` regardless of what happens next, rather than querying it. A
# service that exits right after accepting the start request -- e.g.
# wazuh_ssl_verification 'full'/'certificate' on a fresh token install, where
# wazuh-agentd exits before the enrollment bootstrap can write the CA it demands
# (error 4118) -- reports success here with no recovery policy configured on the
# service (verified: it stays Stopped indefinitely, does not retry on its own).
# Only win_service_info queries the real, live state.
#
# Retried rather than checked once: a successful token enrollment makes the agent
# reload and restart itself right after (shared configuration changes), which is
# normal and briefly reports a non-running state -- verified to clear in a few
# seconds. 6 tries * 5s is generous slack for that restart while staying far short
# of the failure case, which stays Stopped for as long as it was observed (5+
# minutes), so it cannot be mistaken for the same transient.
- name: Windows | Query the real state of the Wazuh agent service, tolerating the post-enrollment restart
  ansible.windows.win_service_info:
    name: "Wazuh"
  register: wazuh_agent_service_info
  until: wazuh_agent_service_info.services | length > 0 and wazuh_agent_service_info.services[0].state == 'running'
  retries: 6
  delay: 5
  failed_when: false

- name: Windows | Assert the Wazuh agent service stayed running
  ansible.builtin.assert:
    that:
      - wazuh_agent_service_info.services | length > 0
      - wazuh_agent_service_info.services[0].state == 'running'
    fail_msg: >-
      The Wazuh agent service did not stay running after start. This is most often
      wazuh-agentd exiting immediately after a failed startup validation -- check
      {{ wazuh_agent_win_install_path }}\ossec.log for the reason (e.g. error 4118 if
      wazuh_ssl_verification is 'full'/'certificate' on a fresh token install; see
      docs/ref/roles/wazuh-agent.md).

- name: Windows | Delete Wazuh agent download directory
  ansible.windows.win_file:
    path: "{{ wazuh_agent_win_package_download_path }}"
    state: absent
