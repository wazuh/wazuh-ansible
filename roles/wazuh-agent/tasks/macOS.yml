---

- name: MacOS | Create directory for Wazuh agent package
  ansible.builtin.file:
    path: "{{ wazuh_agent_package_download_path }}"
    state: directory
    mode: '0755'

- name: MacOS (Intel) | Download Wazuh agent package
  ansible.builtin.get_url:
    url: "{{ wazuh_agent_macos_intel64 }}"
    dest: "{{ wazuh_agent_package_download_path }}/{{ wazuh_agent_package_name }}.pkg"
    mode: '0644'
  when:
    - ansible_facts.architecture == "x86_64"

- name: MacOS (ARM) | Download Wazuh agent package
  ansible.builtin.get_url:
    url: "{{ wazuh_agent_macos_arm64 }}"
    dest: "{{ wazuh_agent_package_download_path }}/{{ wazuh_agent_package_name }}.pkg"
    mode: '0644'
  when:
    - ansible_facts.architecture == "arm64"

- name: MacOS | Check installed packages
  ansible.builtin.command: "pkgutil --pkgs"
  register: installed_packages
  failed_when: false
  changed_when: false

- name: MacOS | Check if Wazuh agent is already installed
  ansible.builtin.set_fact:
    wazuh_agent_already_installed: "{{ 'com.wazuh.pkg.wazuh-agent' in installed_packages.stdout }}"

- name: MacOS | Install and load Wazuh agent
  when: not wazuh_agent_already_installed
  block:
    # Written only on the install path, since the installer is the only thing
    # that reads it, and mode 0600 because it carries the enrollment token.
    # Removed again in `always` below: the installer deletes it itself on
    # success (register_configure_agent.sh, WAZUH_MACOS_AGENT_DEPLOYMENT_VARS),
    # so this covers the failure paths. Since wazuh/wazuh#39063, a 5.x agent
    # enrolls with a single enrollment token: the manager address and the CA
    # pin travel inside the token itself, fetched over /cacerts and verified
    # against the token's pin on the agent's first start. No CA file is
    # pre-staged, and none of WAZUH_MANAGER, WAZUH_REGISTRATION_PASSWORD,
    # WAZUH_MANAGER_ENDPOINT or WAZUH_REGISTRATION_CA apply anymore
    # (warn-and-ignore on install); SSL_VERIFICATION is renamed
    # WAZUH_SSL_VERIFICATION, same rename as on Linux and Windows.
    - name: MacOS | Create Wazuh environment variables file
      ansible.builtin.copy:
        content: |
          WAZUH_ENROLLMENT_TOKEN="{{ wazuh_enrollment_token }}"
          {% if wazuh_ssl_verification | default('') | length > 0 %}
          WAZUH_SSL_VERIFICATION="{{ wazuh_ssl_verification }}"
          {% endif %}
        dest: /tmp/wazuh_envs
        owner: root
        group: wheel
        mode: '0600'

    - name: MacOS | Install Wazuh agent using installer
      ansible.builtin.command: "installer -pkg {{ wazuh_agent_package_download_path }}/{{ wazuh_agent_package_name }}.pkg -target /"
      register: install_pkg
      changed_when: install_pkg.rc == 0

    - name: MacOS | Initialize Wazuh agent service (MacOS 10.10+)
      ansible.builtin.command: "launchctl bootstrap system /Library/LaunchDaemons/com.wazuh.agent.plist"
      when: ansible_facts.distribution_version is version('10.10', '>=')
      changed_when: false

    - name: MacOS | Load Wazuh agent service (MacOS < 10.10)
      ansible.builtin.command: "launchctl load /Library/LaunchDaemons/com.wazuh.agent.plist"
      when: ansible_facts.distribution_version is version('10.10', '<')
      changed_when: false

    - name: MacOS | Start Wazuh agent service (MacOS 10.10+)
      ansible.builtin.command: "launchctl kickstart -k system/com.wazuh.agent"
      when: ansible_facts.distribution_version is version('10.10', '>=')
      changed_when: false

    - name: MacOS | Start Wazuh agent service (MacOS < 10.10)
      ansible.builtin.command: "launchctl unload /Library/LaunchDaemons/com.wazuh.agent.plist && launchctl load /Library/LaunchDaemons/com.wazuh.agent.plist"
      when: ansible_facts.distribution_version is version('10.10', '<')
      changed_when: false

    - name: MacOS | Pause for 5 seconds while Wazuh agent service initializes
      ansible.builtin.command: /bin/sleep 5
      changed_when: false

  always:
    - name: MacOS | Remove the Wazuh environment variables file
      ansible.builtin.file:
        path: /tmp/wazuh_envs
        state: absent

- name: MacOS | Verify Wazuh agent service is running
  ansible.builtin.command: "launchctl print system/com.wazuh.agent"
  register: wazuh_agent_service_status
  failed_when: "'state = running' not in wazuh_agent_service_status.stdout"
  changed_when: false

# The check above only confirms launchd's own supervisor process (Wazuh-launcher)
# stayed up -- that process wraps wazuh-agentd but does not monitor or relaunch it,
# so it reports "running" even when the wazuh-agentd it spawned exits right after
# start (e.g. the same 4118 deadlock documented for Linux/Windows, or a refused
# enrollment token) and never restarts on its own. Verified: distinct from launchd's
# own state, and from win_service's problem on Windows (a state that is not queried
# live at all) -- here launchd's state is real, it is just the wrong process.
#
# Retried, not checked once, for the same reason as on Windows: a successful
# enrollment makes the agent reload and restart itself right after (shared
# configuration changes), which is normal and briefly leaves no wazuh-agentd
# process for a few seconds. 6 tries * 5s is generous slack for that restart while
# staying far short of the failure case, which does not recover on its own.
- name: MacOS | Wait for the wazuh-agentd process itself, tolerating the post-enrollment restart
  ansible.builtin.command: pgrep -x wazuh-agentd
  register: wazuh_agentd_pgrep
  until: wazuh_agentd_pgrep.rc == 0
  retries: 6
  delay: 5
  changed_when: false
  failed_when: false

- name: MacOS | Assert the wazuh-agentd process is actually running
  ansible.builtin.assert:
    that:
      - wazuh_agentd_pgrep.rc == 0
    fail_msg: >-
      The wazuh-agentd process is not running, even though the launchd wrapper
      (com.wazuh.agent / Wazuh-launcher) stayed up. Check
      {{ wazuh_agent_macos_install_path }}/logs/ossec.log for the reason -- for example
      error 4118 if wazuh_ssl_verification is 'full'/'certificate' on a fresh token
      install, or ERR_BAD_TOKEN for an invalid or missing enrollment token (see
      docs/ref/roles/wazuh-agent.md).
