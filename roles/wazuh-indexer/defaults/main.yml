---

single_node: false
instances:
  aio_node:
    name: indexer
    ip: "{{ hostvars[inventory_hostname].private_ip }}"
    role: aio

wazuh_indexer_package_download_path: "/tmp/wazuh-indexer"
wazuh_indexer_package_name: "wazuh-indexer-{{ wazuh_full_version }}-{{ wazuh_package_revision }}"
wazuh_indexer_heap_size: ""
wazuh_indexer_security_init_force: false

# Content of /etc/wazuh-indexer/wazuh-indexer-setup/setup.yml, the index template settings and ISM policy
# switches of the setup plugin, written on every indexer node. Empty: the packaged file is left as it is.
wazuh_indexer_setup_config: ""
# Default ISM policy id -> content of its <policy-id>.json, as YAML ({policy: {...}}), written on every
# indexer node; used when setup.yml sets policies.<policy-id>.custom: true. Empty: the packaged files are
# left as they are.
wazuh_indexer_setup_policies: {}

# Attempts, 5 seconds apart, of the waits on the indexer API, and seconds indexer-security-init.sh may
# take before it is stopped.
wazuh_indexer_api_retries: 24
wazuh_indexer_security_init_timeout: 600

# Attempts, 10 seconds apart, of the wait after a node of a running cluster restarts: the node must join
# the cluster again, and the cluster must be as healthy as before the restart (green, or yellow with no
# shard initializing), before the next node restarts. Also the wait for a stopped node to join the cluster
# before the first restart.
wazuh_indexer_restart_retries: 60
