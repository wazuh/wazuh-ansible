---

single_node: false
instances:
  aio_node:
    name: indexer
    ip: "{{ hostvars[inventory_hostname].private_ip }}"
    role: aio

wazuh_indexer_package_download_path: "/tmp/wazuh-indexer"
wazuh_indexer_package_name: "wazuh-indexer-{{ wazuh_full_version }}-{{ wazuh_package_revision }}"
wazuh_indexer_heap_size: ""
wazuh_indexer_security_init_force: false

# Attempts, 5 seconds apart, of the waits on the indexer API, and seconds indexer-security-init.sh may
# take before it is stopped.
wazuh_indexer_api_retries: 24
wazuh_indexer_security_init_timeout: 600

# Attempts, 10 seconds apart, of the wait after a node of a running cluster restarts: the node must join
# the cluster again, and the cluster must be green again if it was green before the restart (yellow
# otherwise), before the next node restarts.
wazuh_indexer_restart_retries: 60
