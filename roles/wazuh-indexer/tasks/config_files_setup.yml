---

- name: Cert-gen | Check that the package reads the staged certificate pair
  when: generate_certs
  block:
    - name: Cert-gen | Read opensearch.yml
      ansible.builtin.slurp:
        path: /etc/wazuh-indexer/opensearch.yml
      register: wazuh_indexer_conf_raw

    - name: Cert-gen | Assert the transport and HTTP certificates are the staged ones
      ansible.builtin.assert:
        that:
          - conf_text is search('(?m)^plugins\.security\.ssl\.transport\.pemcert_filepath:\s*/etc/wazuh-indexer/certs/indexer\.pem\s*$')
          - conf_text is search('(?m)^plugins\.security\.ssl\.http\.pemcert_filepath:\s*/etc/wazuh-indexer/certs/indexer\.pem\s*$')
        fail_msg: >-
          /etc/wazuh-indexer/opensearch.yml does not point at /etc/wazuh-indexer/certs/indexer.pem,
          the pair staged before installation.
        quiet: true
      vars:
        conf_text: "{{ wazuh_indexer_conf_raw.content | b64decode }}"

- name: OpenSearch Config | Configure Wazuh indexer
  block:
    - name: OpenSearch Config | Update network.host configuration
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/opensearch.yml
        regexp: '^network\.host:'
        line: "network.host: '{{ hostvars[inventory_hostname].private_ip }}'"

    - name: OpenSearch Config | Update node.name configuration
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/opensearch.yml
        regexp: '^node\.name:'
        line: 'node.name: "{{ node_name }}"'

    - name: OpenSearch Config | Configure cluster.initial_cluster_manager_nodes
      block:
        - name: OpenSearch Config | Update cluster.initial_cluster_manager_nodes values
          ansible.builtin.replace:
            path: /etc/wazuh-indexer/opensearch.yml
            regexp: '(?m)^(cluster\.initial_cluster_manager_nodes:\n)(?:[ \t]*#?-.*\n)*'
            replace: |
              cluster.initial_cluster_manager_nodes:
              {% for (key, value) in instances.items() %}
              {% if (value.role is defined and (value.role == 'indexer' or value.role == 'aio')) %}
              - "{{ value.name }}"
              {% endif %}
              {% endfor %}
          when: not single_node

        - name: OpenSearch Config | Remove cluster.initial_cluster_manager_nodes for single-node cluster
          ansible.builtin.replace:
            path: /etc/wazuh-indexer/opensearch.yml
            regexp: '(?m)^(cluster\.initial_cluster_manager_nodes:\n)(?:[ \t]*#?-.*\n)*'
            replace: ''
          when: single_node

    - name: OpenSearch Config | Configure discovery.seed_hosts
      when: not single_node
      block:
        - name: OpenSearch Config | Update discovery.seed_hosts value
          ansible.builtin.replace:
            path: /etc/wazuh-indexer/opensearch.yml
            regexp: '(?m)^#?discovery\.seed_hosts:\n(?:[ \t]+.*\n)*'
            replace: |
              discovery.seed_hosts:
              {% for (key, value) in instances.items() %}
              {% if (value.role is defined and (value.role == 'indexer' or value.role == 'aio')) %}
                - "{{ value.ip }}"
              {% endif %}
              {% endfor %}

    - name: OpenSearch Config | Add SSL configuration
      block:
        # The DN is read from each node's certificate rather than rebuilt from its name: wazuh-certs-tool
        # has used both subject orders (wazuh/wazuh-installation-assistant#1048), and the security plugin
        # rejects a node whose DN is not listed exactly as its certificate presents it. RFC 2253 is the
        # form the indexer package itself writes.
        - name: OpenSearch Config | Read the DN of every indexer node certificate
          ansible.builtin.command:
            cmd: >-
              openssl x509 -in "{{ local_configs_path }}/wazuh-certificates/{{ item.value.name }}.pem"
              -noout -subject -nameopt RFC2253
          loop: "{{ instances | dict2items | selectattr('value.role', 'defined') | selectattr('value.role', 'in', ['indexer', 'aio']) | list }}"
          loop_control:
            label: "{{ item.value.name }}"
          register: wazuh_indexer_node_subjects
          run_once: true
          delegate_to: localhost
          become: false
          changed_when: false
          when: generate_certs

        - name: OpenSearch Config | Update SSL configuration values in plugins.security.nodes_dn
          ansible.builtin.replace:
            path: /etc/wazuh-indexer/opensearch.yml
            regexp: '(?m)^(plugins\.security\.nodes_dn:\n)(?:[ \t]*#?-.*\n)*'
            replace: |
              plugins.security.nodes_dn:
              {% for dn in wazuh_indexer_nodes_dn %}
              - "{{ dn }}"
              {% endfor %}
          vars:
            wazuh_indexer_nodes_dn: >-
              {{ wazuh_indexer_node_subjects.results | map(attribute='stdout')
                 | map('regex_replace', '^subject= *', '') | list
                 if generate_certs else
                 instances | dict2items | selectattr('value.role', 'defined')
                 | selectattr('value.role', 'in', ['indexer', 'aio'])
                 | map(attribute='value.name')
                 | map('regex_replace', '^(.*)$', 'CN=\1,OU=Wazuh,O=Wazuh,L=California,C=US') | list }}

    - name: Add single-node discovery type if needed
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/opensearch.yml
        line: 'discovery.type: single-node'
        insertafter: '^node\.name:'
      when: single_node

- name: JVM Config | Configure heap size for AIO deployment
  when: single_node | bool
  vars:
    wazuh_indexer_heap_size_computed: "{{ wazuh_indexer_heap_size if wazuh_indexer_heap_size | length > 0 else ((ansible_memtotal_mb // 4) | string) + 'm' }}"
  block:
    - name: JVM Config | Set -Xms heap size
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/jvm.options
        regexp: '^-Xms'
        line: "-Xms{{ wazuh_indexer_heap_size_computed }}"

    - name: JVM Config | Set -Xmx heap size
      ansible.builtin.lineinfile:
        path: /etc/wazuh-indexer/jvm.options
        regexp: '^-Xmx'
        line: "-Xmx{{ wazuh_indexer_heap_size_computed }}"
