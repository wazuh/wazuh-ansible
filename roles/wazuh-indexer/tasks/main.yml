---

- name: Importing variables [vars/main.yml]
  ansible.builtin.include_vars:
    file: ../../vars/main.yml

- name: Importing urls_file variables
  ansible.builtin.include_vars:
    file: ../../vars/{{ urls_file }}

- name: Linux | Check whether wazuh-indexer is already installed
  ansible.builtin.include_role:
    name: package-urls
    tasks_from: check_installed.yml
  vars:
    wazuh_installed_package: wazuh-indexer

# Kept apart: the next component's check overwrites wazuh_package_installed.
- name: Linux | Keep whether wazuh-indexer is already installed
  ansible.builtin.set_fact:
    wazuh_indexer_package_installed: "{{ wazuh_package_installed }}"

# A node that already runs is part of a cluster: it restarts in its own turn (rolling_restart.yml).
- name: Linux | Read whether wazuh-indexer runs before this run
  ansible.builtin.systemd_service:
    name: wazuh-indexer
  register: wazuh_indexer_active_before
  failed_when: false

- name: Importing dependencies.yml
  ansible.builtin.import_tasks: dependencies.yml
  become: true

- name: Credentials | Generate or load the deployment passwords
  ansible.builtin.include_role:
    name: wazuh-credentials

- name: Cert-gen | Check if configuration is defined correctly
  ansible.builtin.fail:
    msg: "Single-node cluster is defined incorrectly. Please set single_node to true and define only one node."
  run_once: true
  delegate_to: localhost
  become: false
  when:
    - single_node
    - ( instances | length ) > 1

- name: Cert-gen | Set node name variable
  ansible.builtin.set_fact:
    node_name: "{{ (single_node | bool) | ternary(instances['aio_node'].name, instances[inventory_hostname].name) }}"

# The names of the node certificate (the loopback names are always added). All-in-one, the package
# issues it from the CA it mints; distributed, it is issued on the control node from the CA of the
# deployment and staged in /etc/wazuh-indexer/certs/.
- name: Credentials | Certificate names of this indexer node
  ansible.builtin.set_fact:
    wazuh_credentials_cert_sans:
      WAZUH_INDEXER_CERT_SANS: >-
        {{ (['DNS:' ~ node_name, 'DNS:' ~ ansible_facts.hostname] | unique)
           + ['IP:' ~ hostvars[inventory_hostname].private_ip] }}

- name: Credentials | Provide the indexer credentials before installing the package
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: deploy.yml
  vars:
    wazuh_credentials_component: indexer
    wazuh_credentials_node_name: "{{ node_name }}"

- name: Linux | Verify the wazuh-indexer package signature
  ansible.builtin.include_role:
    name: package-urls
    tasks_from: verify_package_signature.yml
  vars:
    wazuh_package_file: "{{ wazuh_indexer_package_download_path }}/{{ wazuh_indexer_package_name }}_{{ ansible_facts.architecture }}.{{ wazuh_package_type }}"
    wazuh_package_type: "{{ 'rpm' if ansible_facts.os_family == 'RedHat' else 'deb' }}"
  when: not wazuh_indexer_package_installed

- name: Linux CentOS/RedHat | Install wazuh-indexer using yum
  ansible.builtin.dnf:
    name: "{{ wazuh_indexer_package_download_path }}/{{ wazuh_indexer_package_name }}_{{ ansible_facts.architecture }}.rpm"
    state: present
    # dnf also checks a local package, against any key rpm trusts: skipped only along with the Wazuh key check.
    disable_gpg_check: "{{ wazuh_skip_package_signature_check | default(false) | bool }}"
  when:
    - ansible_facts.os_family == 'RedHat'
    - not wazuh_indexer_package_installed
  notify: Wazuh indexer changed

- name: Linux Debian | Install wazuh-indexer using apt
  ansible.builtin.apt:
    deb: "{{ wazuh_indexer_package_download_path }}/{{ wazuh_indexer_package_name }}_{{ ansible_facts.architecture }}.deb"
    state: present
  when:
    - ansible_facts.os_family == 'Debian'
    - not wazuh_indexer_package_installed
  notify: Wazuh indexer changed

# On Amazon Linux 2023, /tmp is a tmpfs: the package would use memory the indexer needs.
- name: Remove Wazuh Indexer installation leftovers
  ansible.builtin.file:
    path: "{{ wazuh_indexer_package_download_path }}"
    state: absent
  become: true

- name: Importing config_files_setup.yml
  ansible.builtin.import_tasks: config_files_setup.yml
  become: true

- name: Linux | Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# The handler records whether the package or the configuration changed: only then is the indexer restarted.
- name: Apply the pending changes of the indexer
  ansible.builtin.meta: flush_handlers

# Distributed: restarting every node of a running cluster at the same time leaves it without a cluster
# manager. A node that ran before this run and has a pending restart waits for its turn. A node that did
# not run starts now in a new cluster, where no node restarts in a turn; when nodes restart in turns (a
# node added to a running cluster), it starts after them: started before, it would get replicas from the
# nodes that do not list it in plugins.security.nodes_dn yet, and the cluster would never be green again.
- name: Restart | List the files changed since the last start of wazuh-indexer
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: changed_files.yml
  vars:
    wazuh_service_name: wazuh-indexer
    wazuh_service_watched_files: "{{ wazuh_indexer_watched_files }}"
  when: not (single_node | bool)

- name: Restart | Tell whether this node restarts in its own turn
  ansible.builtin.set_fact:
    wazuh_indexer_rolling_restart: >-
      {{ not (single_node | bool)
         and (wazuh_indexer_active_before.status | default({})).ActiveState | default('') == 'active'
         and ((wazuh_indexer_restart | default(false) | bool)
              or (wazuh_service_changed_files.stdout_lines | default([]) | length > 0)) }}

- name: Restart | List the nodes that restart in turns
  ansible.builtin.set_fact:
    wazuh_indexer_restart_turns: >-
      {{ ansible_play_hosts | map('extract', hostvars) | selectattr('wazuh_indexer_rolling_restart', 'defined')
         | selectattr('wazuh_indexer_rolling_restart', 'equalto', true) | map(attribute='inventory_hostname') | list }}
    wazuh_indexer_start_after_turns: false

- name: Restart | Tell whether this node starts after the turns
  ansible.builtin.set_fact:
    wazuh_indexer_start_after_turns: >-
      {{ not (wazuh_indexer_rolling_restart | bool)
         and (wazuh_indexer_active_before.status | default({})).ActiveState | default('') != 'active'
         and wazuh_indexer_restart_turns | length > 0 }}

- name: Ensure Wazuh indexer started
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: start_service.yml
  vars:
    wazuh_service_name: wazuh-indexer
    wazuh_service_restart: "{{ wazuh_indexer_restart | default(false) }}"
    wazuh_service_watched_files: "{{ wazuh_indexer_watched_files }}"
  when:
    - not (wazuh_indexer_rolling_restart | bool)
    - not (wazuh_indexer_start_after_turns | bool)

- name: Restart the Wazuh indexer nodes of the cluster one at a time
  ansible.builtin.include_tasks: rolling_restart.yml
  loop: "{{ wazuh_indexer_restart_turns }}"
  loop_control:
    loop_var: wazuh_indexer_restart_turn
  when: inventory_hostname == wazuh_indexer_restart_turn

- name: Ensure the Wazuh indexer nodes added to the cluster started
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: start_service.yml
  vars:
    wazuh_service_name: wazuh-indexer
    wazuh_service_restart: "{{ wazuh_indexer_restart | default(false) }}"
    wazuh_service_watched_files: "{{ wazuh_indexer_watched_files }}"
  when: wazuh_indexer_start_after_turns | bool

# The package never loads the security configuration into the cluster: it cannot know whether other
# nodes are still to be installed (wazuh/wazuh-indexer#1928 FR 29). Its postinst has already written
# the bcrypt digests of the supplied passwords into internal_users.yml, so one upload from one node
# is what makes them live, on a single node and on a cluster alike. The upload replaces the security
# configuration of the cluster with the files of that node, so it is done only while the cluster has
# none: the users, roles and passwords changed later are kept on a rerun.
#
# All-in-one: the node itself tells. It reports UP once it loaded the configuration; installed by an
# earlier run, it answers DOWN for a while after a restart, so it is given time to load it again.
- name: Security init | All-in-one
  when: single_node | bool
  block:
    - name: Read whether this node loaded the security configuration
      ansible.builtin.uri:
        url: "https://{{ hostvars[inventory_hostname].private_ip }}:9200/_plugins/_security/health"
        validate_certs: false
        status_code: [200, 503]
        timeout: 4
      register: wazuh_indexer_security_health
      until: >-
        wazuh_indexer_security_health.status in [200, 503]
        and (not (wazuh_indexer_package_installed | bool)
             or (wazuh_indexer_security_health.json | default({})).status | default('') == 'UP')
      retries: "{{ wazuh_indexer_api_retries }}"
      delay: 5
      failed_when: false

    - name: Keep whether this node loaded the security configuration
      ansible.builtin.set_fact:
        wazuh_indexer_security_loaded: "{{ (wazuh_indexer_security_health.json | default({})).status | default('') == 'UP' }}"

    # Installed by an earlier run and still DOWN after the wait: the upload would replace the configuration
    # it may have, so only wazuh_indexer_security_init_force loads it then.
    - name: Stop when the node installed by an earlier run does not report the security configuration
      ansible.builtin.fail:
        msg: >-
          The indexer does not report the security configuration loaded (GET /_plugins/_security/health),
          but it was installed by an earlier run: loading the files of the node would replace its users,
          roles and passwords. To load them anyway, for instance after a first run that stopped before the
          upload, run again with wazuh_indexer_security_init_force=true.
      when:
        - not (wazuh_indexer_security_init_force | bool)
        - not (wazuh_indexer_security_loaded | bool)
        - wazuh_indexer_package_installed | bool

# Distributed: the cluster tells, asked with the admin certificate, which the REST API accepts before the
# security configuration is loaded and which does not depend on passwords changed later. A node that
# joined an existing cluster, also in a run with --limit, sees its security index. A node the others
# reject (added to instances after they were installed, so their nodes_dn does not list it) never sees a
# cluster manager, and the run stops before anything is loaded.
- name: Security init | Distributed
  when: not (single_node | bool)
  block:
    - name: Wait for the Wazuh indexer cluster to recover its state
      ansible.builtin.uri:
        url: "https://{{ hostvars[inventory_hostname].private_ip }}:9200/_cluster/health?wait_for_status=yellow&timeout=4s"
        client_cert: /etc/wazuh-indexer/certs/admin.pem
        client_key: /etc/wazuh-indexer/certs/admin-key.pem
        validate_certs: false
        timeout: 10
      register: wazuh_indexer_cluster_health
      until: wazuh_indexer_cluster_health.status == 200
      retries: "{{ wazuh_indexer_api_retries }}"
      delay: 5

    - name: Check whether the cluster has the security configuration
      ansible.builtin.uri:
        url: "https://{{ hostvars[inventory_hostname].private_ip }}:9200/.opendistro_security"
        method: HEAD
        client_cert: /etc/wazuh-indexer/certs/admin.pem
        client_key: /etc/wazuh-indexer/certs/admin-key.pem
        validate_certs: false
        status_code: [200, 404]
        timeout: 4
      register: wazuh_indexer_security_index
      until: wazuh_indexer_security_index.status in [200, 404]
      retries: "{{ wazuh_indexer_api_retries }}"
      delay: 5
      run_once: true

  # The health answers 503 without a cluster manager and 408 when a cluster manager is elected but the
  # cluster is not yellow in time. Any other failure of the health, or a failure of the HEAD after a
  # healthy cluster, is reported with its own status.
  rescue:
    - name: Security init | Report why the cluster did not answer
      ansible.builtin.fail:
        msg: "{{ wazuh_indexer_security_check_messages[wazuh_indexer_security_check_case] }}"
      vars:
        wazuh_indexer_health_status: "{{ (wazuh_indexer_cluster_health | default({})).status | default(-1) | int }}"
        wazuh_indexer_security_check_case: >-
          {{ 'index' if wazuh_indexer_health_status | int == 200
             else (wazuh_indexer_health_status | string if wazuh_indexer_health_status | int in [408, 503]
                   else 'health') }}
        wazuh_indexer_security_check_detail: >-
          {{ (wazuh_indexer_security_index | default({})) if wazuh_indexer_security_check_case == 'index'
             else (wazuh_indexer_cluster_health | default({})) }}
        wazuh_indexer_security_check_messages:
          '503': >-
            {{ inventory_hostname }} did not see a cluster manager after {{ wazuh_indexer_api_retries }}
            attempts (GET /_cluster/health answered 503). A node added to instances after the other indexer
            nodes were installed is rejected by them until their plugins.security.nodes_dn lists it: run the
            playbook with every Wazuh Indexer node, not --limit to the new one. Otherwise check that most of
            the indexer nodes are up, and journalctl -u wazuh-indexer.
          '408': >-
            {{ inventory_hostname }} sees a cluster manager, but the cluster did not reach the yellow status
            after {{ wazuh_indexer_api_retries }} attempts (GET /_cluster/health?wait_for_status=yellow answered
            408): its state is not recovered yet, or it is red, for instance with a primary shard on a node that
            is down. Check GET /_cluster/health and GET /_cluster/allocation/explain, and journalctl -u
            wazuh-indexer on the indexer nodes.
          health: >-
            {{ inventory_hostname }} could not ask the cluster for its health after {{ wazuh_indexer_api_retries }}
            attempts (GET /_cluster/health, HTTP status {{ wazuh_indexer_security_check_detail.status | default(-1) }}:
            {{ wazuh_indexer_security_check_detail.msg | default('no response') | truncate(300) }}). Check that the
            indexer listens on {{ hostvars[inventory_hostname].private_ip }}:9200, that
            /etc/wazuh-indexer/certs/admin.pem and admin-key.pem are in place, and journalctl -u wazuh-indexer.
          index: >-
            The cluster is healthy, but HEAD /.opendistro_security failed after {{ wazuh_indexer_api_retries }}
            attempts (HTTP status {{ wazuh_indexer_security_check_detail.status | default(-1) }}:
            {{ wazuh_indexer_security_check_detail.msg | default('no response') | truncate(300) }}), so the role
            cannot tell whether the security configuration is loaded, and loads nothing. Check that the admin
            certificate (/etc/wazuh-indexer/certs/admin.pem) is listed in plugins.security.authcz.admin_dn, and
            journalctl -u wazuh-indexer.

# securityadmin.sh waits without end for a cluster with a manager, so the run is bounded.
- name: Initialize Wazuh Indexer cluster
  when: >-
    (wazuh_indexer_security_init_force | bool)
    or ((single_node | bool) and not (wazuh_indexer_security_loaded | bool))
    or (not (single_node | bool) and wazuh_indexer_security_index.status == 404)
  block:
    - name: Initialize Wazuh Indexer cluster
      ansible.builtin.command:
        argv:
          - timeout
          - --kill-after=30
          - "{{ wazuh_indexer_security_init_timeout }}"
          - /usr/share/wazuh-indexer/bin/indexer-security-init.sh
      become: true
      run_once: true
      changed_when: true
      register: wazuh_indexer_security_init

  rescue:
    - name: Initialize Wazuh Indexer cluster | Report the failure
      ansible.builtin.fail:
        msg: >-
          indexer-security-init.sh {{ wazuh_indexer_security_init_outcome }}.
          securityadmin.sh needs a cluster with a manager: check that every indexer node is up and that
          plugins.security.nodes_dn lists all of them on every node. Its output is in the task above.
      vars:
        wazuh_indexer_security_init_outcome: >-
          {{ ('did not finish in ' ~ wazuh_indexer_security_init_timeout ~ ' seconds and was stopped')
             if (wazuh_indexer_security_init.rc | default(0)) in [124, 137]
             else ('failed (exit code ' ~ (wazuh_indexer_security_init.rc | default('none')) ~ ')') }}
      run_once: true

- name: Credentials | Use the passwords the indexer published
  ansible.builtin.include_role:
    name: wazuh-credentials
    tasks_from: published.yml
  vars:
    wazuh_credentials_component: indexer

- name: Wait for Wazuh indexer API
  block:
    - name: Wait for Wazuh indexer API
      ansible.builtin.uri:
        url: "https://{{ hostvars[inventory_hostname].private_ip }}:9200/_cat/health/"
        user: "admin"
        password: "{{ wazuh_credentials.WAZUH_INDEXER_ADMIN_PASSWORD }}"
        validate_certs: false
        status_code: 200,401
        return_content: true
        timeout: 4
      register: _result
      until:
        - _result is defined
        - '"green" in _result.content or ( "yellow" in _result.content and single_node )'
      retries: "{{ wazuh_indexer_api_retries }}"
      delay: 5
      no_log: true

  # no_log hides why the wait gave up; report only the last HTTP status, never the credentials or
  # the response body.
  rescue:
    - name: Wait for Wazuh indexer API | Report the last HTTP status
      ansible.builtin.fail:
        msg: >-
          The Wazuh indexer API did not report a healthy cluster after {{ wazuh_indexer_api_retries }} attempts.
          Last HTTP status: {{ _result.status | default('none') }}.
          {{ ('The admin password was rejected: check that indexer-security-init.sh loaded the security
          configuration and that WAZUH_INDEXER_ADMIN_PASSWORD was in /etc/wazuh-indexer/local.env before
          the package was installed.' ~ ('' if (single_node | default(false) | bool) else ' After a password
          change, copy the new value to deployment-credentials/WAZUH_INDEXER_ADMIN_PASSWORD on the control
          node.'))
          if (_result.status | default(0)) == 401
          else 'Check the service with journalctl -u wazuh-indexer.' }}
