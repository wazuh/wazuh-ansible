---

- name: Wazuh All-in-One Deployment
  hosts: aio
  become: true
  roles:
    - role: package-urls
    - role: wazuh-indexer
    - role: wazuh-manager
    - role: wazuh-dashboard
  vars:
    single_node: true

- name: Summary
  ansible.builtin.import_playbook: summary.yml
  vars:
    wazuh_summary_components:
      wazuh-indexer: aio
      wazuh-manager: aio
      wazuh-dashboard: aio
