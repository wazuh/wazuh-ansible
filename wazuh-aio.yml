---

- name: Wazuh All-in-One Deployment
  hosts: aio
  become: true
  roles:
    - role: package-urls
    - role: wazuh-indexer
    - role: wazuh-manager
    - role: wazuh-dashboard
  vars:
    single_node: true
  post_tasks:
    - name: Remove the credentials handoff file once every component is running
      ansible.builtin.include_role:
        name: wazuh-credentials
        tasks_from: cleanup.yml
